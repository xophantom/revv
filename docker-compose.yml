services:
  db:
    image: postgres:16-alpine
    container_name: revv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revv
      POSTGRES_PASSWORD: revv
      POSTGRES_DB: revv
    ports:
      - "5433:5432"
    volumes:
      - revv-pg:/var/lib/postgresql/data
volumes:
  revv-pg:
